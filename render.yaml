# Render Blueprint — deploys the Tempo API (NestJS) as a free native-Node
# web service. The Next.js web app deploys separately on Vercel; Postgres is
# hosted free on Neon. See docs/DEPLOYMENT.md for the full walkthrough.
#
# Redis is intentionally omitted: with REDIS_URL unset the API runs its job
# queue and cache in-process (fine for a single free instance).
services:
  - type: web
    name: tempo-api
    runtime: node
    plan: free
    rootDir: .
    # Install the exact pinned pnpm via npm rather than `corepack enable` —
    # corepack's bundled signing keys can lag npm's current key rotation,
    # failing fresh installs with "Cannot find matching keyid". Then build the
    # workspace packages the API depends on, generate the Prisma client, and
    # compile the API. turbo resolves ^build ordering.
    buildCommand: npm install -g pnpm@11.12.0 && pnpm install --frozen-lockfile && pnpm --filter @tempo/db generate && pnpm turbo run build --filter=api
    # Apply pending migrations (idempotent) then boot. No dotenv file in prod —
    # env comes from Render; DATABASE_URL is injected below.
    startCommand: pnpm --filter @tempo/db run deploy && node apps/api/dist/main.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      # Render injects $PORT automatically; the API reads it (see main.ts).
      # Secrets set in the Render dashboard (not committed):
      - key: DATABASE_URL
        sync: false # Neon pooled connection string
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      - key: WEB_URL
        sync: false # Vercel origin(s) for CORS — comma-separated to allow previews
      - key: CHESSCOM_USER_AGENT
        sync: false
      # OPTIONAL. Leave unset on free tier → in-process queue (recommended:
      # avoids Upstash's daily command quota, which BullMQ's polling burns
      # fast). Set to an Upstash rediss:// URL only if you scale to >1 instance.
      - key: REDIS_URL
        sync: false
